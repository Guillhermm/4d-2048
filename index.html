<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<div class="wrap">
  <header>
    <h1>2048 4D</h1>
    <p class="lede">2048 played on a real four-dimensional board.</p>

    <section class="stage" aria-label="Board">

  </div>
</div>
