<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>2048 4D</title>
<script src="src/theme-boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div class="wrap">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.4"/>
      <path d="M19.4 14a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5v.2a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 010-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 014 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1h.2a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1z"/>
    </symbol>
    <symbol id="i-move" viewBox="0 0 24 24">
      <path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>
    </symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24">
      <path d="M19.5 12a7.5 7.5 0 11-2.2-5.3M19.5 4.5v4h-4"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5.5v13l10.5-6.5z"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M9 5.5v13M15 5.5v13"/>
    </symbol>
    <symbol id="i-target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"/>
      <circle cx="12" cy="12" r="1.2"/>
      <path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </symbol>
  </svg>

  <header>
    <div class="brand-row">
      <h1>2048 4D</h1>
      <button type="button" id="openSettings" class="btn-settings" data-i18n-aria="settings" data-i18n-title="settings" aria-label="Settings" title="Settings">
        <svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg>
      </button>
    </div>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <div class="layout">
    <section class="scorebar" data-i18n-aria="score" aria-label="Score">
      <div class="score-box"><span class="label" data-i18n="score">Score</span><output id="score">0</output></div>
      <div class="score-box"><span class="label" data-i18n="best">Best</span><output id="best">0</output></div>
      <button type="button" id="newGame" class="btn-primary" data-i18n="newGame">New game</button>
      <span class="move-count" id="moveCount"></span>
    </section>

    <section class="stage" data-i18n-aria="boardRegion" aria-label="Board">
      <div class="canvas-box" id="canvasBox">
        <canvas id="board" role="img" data-i18n-aria="canvasLabel" aria-label="4D board projected on screen"></canvas>
        <div class="view-controls view-hint" id="swipeHint" role="status" hidden></div>
        <div class="view-controls view-controls-top">
          <button type="button" id="autoRotate" class="view-btn" aria-pressed="false" data-i18n-aria="autoRotate" data-i18n-title="autoRotate" aria-label="Rotate by itself" title="Rotate by itself">
            <svg class="icon icon-off" aria-hidden="true"><use href="#i-play"/></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="#i-pause"/></svg>
          </button>
          <button type="button" id="alignView" class="view-btn" data-i18n-aria="alignView" data-i18n-title="alignView" aria-label="Reset view" title="Reset view">
            <svg class="icon" aria-hidden="true"><use href="#i-target"/></svg>
          </button>
        </div>
        <div class="view-controls">
          <button type="button" id="rotateAxis" class="view-chip" hidden>→ w</button>
          <button type="button" id="dragMode" class="view-btn" aria-pressed="false" data-i18n-aria="rotateMode" data-i18n-title="rotateMode" aria-label="Turn the view by dragging" title="Turn the view by dragging">
            <svg class="icon icon-off" aria-hidden="true"><use href="#i-move"/></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="#i-rotate"/></svg>
          </button>
        </div>
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card" role="dialog" aria-labelledby="overlayTitle">
            <h2 id="overlayTitle"></h2>
            <p id="overlayText"></p>
            <button type="button" id="overlayPrimary"></button>
          </div>
        </div>
      </div>
      <p class="caption" data-i18n="caption"></p>
    </section>

    <aside class="panel" data-i18n-aria="controlsRegion" aria-label="Controls">
      <div class="group">
        <span class="label" id="padLabel" data-i18n="padLabel">Move along an axis</span>
        <div class="pad" id="pad" role="group" aria-labelledby="padLabel"></div>
        <p class="hint" data-i18n="keyboardHint"></p>
      </div>

      <div class="board-info">
        <span class="label" data-i18n="boardLabel">Board</span>
        <span class="board-size" data-i18n="size2">2⁴ · 16 cells</span>
      </div>
    </aside>
  </div>
</div>
<dialog id="settings" class="settings" aria-labelledby="settingsTitle">
  <div class="settings-body">
    <div class="settings-head">
      <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
      <button type="button" id="closeSettings" class="settings-close" data-i18n-aria="close" aria-label="Close">&times;</button>
    </div>
    <section class="settings-group">
      <h3 class="settings-group-title" id="appearanceTitle" data-i18n="appearance">Appearance</h3>
      <ul class="settings-options" id="themeOptions" role="radiogroup" aria-labelledby="appearanceTitle"></ul>
    </section>
    <section class="settings-group">
      <h3 class="settings-group-title" id="languageTitle" data-i18n="language">Language</h3>
      <ul class="settings-options" id="languageOptions" role="radiogroup" aria-labelledby="languageTitle"></ul>
    </section>
    <p class="settings-note" data-i18n="settingsNote"></p>
  </div>
</dialog>
</body>
</html>
